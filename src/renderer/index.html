<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' gr: data:; media-src gr:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Game Recorder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <nav class="rail">
        <div class="rail-logo" title="Game Recorder">
          <svg viewBox="0 0 512 512" aria-hidden="true">
            <circle cx="256" cy="256" r="150" fill="none" stroke="currentColor" stroke-width="44" />
            <circle cx="256" cy="256" r="82" fill="currentColor" />
          </svg>
        </div>
        <button class="rail-btn" data-route="library" title="Parties">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v11H4z M8 20h8 M12 16v4" /></svg>
          <span>Parties</span>
        </button>
        <button class="rail-btn" data-route="clips" title="Clips">
          <svg viewBox="0 0 24 24"><path d="M4 7h16v12H4z M4 7l3-3h4l-3 3 M11 7l3-3h4l-3 3" /></svg>
          <span>Clips</span>
        </button>
        <div class="rail-spacer"></div>
        <button class="rail-btn" data-route="settings" title="Paramètres">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
            />
          </svg>
          <span>Réglages</span>
        </button>
      </nav>
      <div class="main">
        <header class="statusbar" id="statusbar">
          <span class="status-dot"></span>
          <span class="status-text">…</span>
          <span class="status-extra"></span>
        </header>
        <main id="view"></main>
      </div>
    </div>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
